<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Vue Dynamic Template Render (UMD 加载版)</title>
    <style>
        .btn.primary {
            background: #409EFF;
            color: white;
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
        }
        .region {
            border: 1px solid #ccc;
            padding: 12px;
            margin: 12px;
        }
    </style>
</head>
<body>
<div id="app"></div>

<!-- Vue 3 完整版（含运行时编译器） -->
<script src="/vue/vue.global.js"></script>
<script src="/vue/compiler-dom.esm-browser.js"></script>
<script>
    const { createApp, defineComponent } = Vue
    const { compile } = VueCompilerDOM  // 全局编译器

    // 模板字符串
    const templateStr = `
      <XRegion id="r1" title="查询表">
        <button class="btn primary" @click="alert('查询')">查询</button>
      </XRegion>
    `

    // 组件名 → UMD 脚本地址映射
    const componentMap = {
        XRegion: '/XRegion/index.umd.js',
    }

    // 从 AST 提取大写组件名
    function extractComponentNames(template) {
        const ast = compile(template, { mode: 'module' }) // 解析为 AST
        const components = new Set()
        const walk = (node) => {
            if (node.type === 1) {
                if (/^[A-Z]/.test(node.tag)) components.add(node.tag)
                node.children.forEach(walk)
            } else if (node.type === 9) {
                node.branches.forEach(b => b.children.forEach(walk))
            } else if (node.type === 11) {
                node.children.forEach(walk)
            }
        }
        ast.children.forEach(walk)
        return Array.from(components)
    }

    // 动态插入 <script> 加载 UMD，并从 window[name] 取出组件
    function loadComponent(name, url) {
        return new Promise((resolve, reject) => {
            if (window[name]) {
                // 已经加载过
                return resolve({ name, component: window[name] })
            }
            const s = document.createElement('script')
            s.src = url
            s.onload = () => {
                if (window[name]) {
                    resolve({ name, component: window[name] })
                } else {
                    reject(new Error(`全局变量 window.${name} 未找到`))
                }
            }
            s.onerror = () => reject(new Error(`加载脚本失败: ${url}`))
            document.head.appendChild(s)
        })
    }

    // 批量加载并注册
    async function loadAndRegisterComponents(template, app) {
        const names = extractComponentNames(template)
        const list = await Promise.all(names.map(n => loadComponent(n, componentMap[n])))
        list.forEach(({ name, component }) => {
            app.component(name, component)
        })
    }

    // 用编译后的 render 函数代替 template
    function renderTemplate(template) {
        const { code } = compile(template, { mode: 'function' })
        // code 形如: `with(this){return h(...)}`
        const render = new Function('Vue', code)(Vue)
        return defineComponent({ render, methods: { alert(msg){ alert(msg) } } })
    }

    // 启动
    async function start() {
        const DynamicComp = renderTemplate(templateStr)
        const app = createApp(DynamicComp)
        await loadAndRegisterComponents(templateStr, app)
        app.mount('#app')
    }

    start()
</script>
</body>
</html>
